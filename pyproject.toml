[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dirmo-3d"
version = "0.1.0"
description = "Diagnosis-guided intervention routing for 3D molecular optimization"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "numpy>=1.24", "rdkit>=2023.9", "biopython>=1.81"]

[project.optional-dependencies]
evaluation = ["posebusters>=0.3.1", "pandas>=2.0", "vina>=1.2.6", "meeko>=0.8", "gemmi", "prolif>=2", "MDAnalysis>=2.7"]
training = ["torch>=2.5", "scikit-learn>=1.3"]
llm = ["torch>=2.5,<3", "transformers[chat-template]>=5.15,<6", "accelerate>=1.1,<2"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
dirmo = "dirmo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
